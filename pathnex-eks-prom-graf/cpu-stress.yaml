apiVersion: apps/v1
kind: Deployment
metadata:
  name: cpu-stress-app
  namespace: monitoring-lab
spec:
  replicas: 3
  selector:
    matchLabels:
      app: cpu-stress-app
  template:
    metadata:
      labels:
        app: cpu-stress-app
    spec:
      containers:
        - name: stress
          image: vish/stress
          args:
            - "-cpus"
            - "1"
          resources:
            requests:
              cpu: "1"
              memory: "64Mi"
            limits:
              cpu: "2"
              memory: "128Mi"